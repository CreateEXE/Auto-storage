name: Android Release Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: "platforms;android-35 platform-tools build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate release keystore
        run: |
          mkdir -p app/build/generated
          rm -f app/build/generated/github-release-key.jks

          keytool -genkeypair \
            -keystore "$GITHUB_WORKSPACE/app/build/generated/github-release-key.jks" \
            -storetype JKS \
            -storepass github-build-password \
            -keypass github-build-password \
            -alias github-build \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Auto-storage, OU=Build, O=Auto-storage, L=Barstow, ST=California, C=US"

      - name: Verify release keystore
        run: |
          test -f "$GITHUB_WORKSPACE/app/build/generated/github-release-key.jks"

          keytool -list \
            -storetype JKS \
            -keystore "$GITHUB_WORKSPACE/app/build/generated/github-release-key.jks" \
            -storepass github-build-password \
            -alias github-build

      - name: Build Release APK
        run: ./gradlew clean assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error
